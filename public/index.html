<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1a2a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Catan">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <title>Catan gegen Bots</title>
  <meta name="description" content="Siedler von Catan im Browser – gegen Bots, mit Nebel-Variante, Weltenwandel, Anti-Pech-Markern und Missionen.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f4efe3' d='M12 2l8.7 5v10L12 22l-8.7-5V7z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="menu" class="screen"></div>

  <div id="game" class="screen hidden" data-phase="setup">
    <header class="hdr">
      <div class="hdr-left" id="hudHand"></div>
      <div class="hdr-players" id="hudOpps"></div>
      <div class="hdr-btns">
        <button id="btnPause" class="hbtn" aria-label="Pause" title="Pause (P)"></button>
        <button id="btnMusic" class="hbtn" aria-label="Musik an/aus" title="Musik an/aus"></button>
        <div class="menu-wrap-btn">
          <button id="btnMenu" class="hbtn" aria-label="Einstellungen" title="Einstellungen" aria-haspopup="true"></button>
          <div id="menuPop" class="popover hidden" role="menu"></div>
        </div>
      </div>
    </header>

    <main class="stage">
      <svg id="board" viewBox="-10 -10 20 20" preserveAspectRatio="xMidYMid meet"></svg>

      <div class="floatcol">
        <div id="decreeBox" class="decrees"></div>
        <div id="missionBox" class="floatbox"></div>
      </div>
      <div id="diceBox" class="dicebox"></div>
      <div id="diceHero" class="dicehero"></div>
      <div id="heroRoll" class="heroroll"></div>
      <aside id="market" class="tp-layer"></aside>
      <div class="bottombar">
        <div id="fab" class="fab"></div>
        <div id="handBar" class="handbar"><div id="handFan" class="hand-fan" aria-label="Deine Rohstoffkarten"></div></div>
        <div id="nextWrap" class="nextwrap"></div>
      </div>

      <div class="zoom">
        <button id="zoomIn" aria-label="Vergrößern"></button>
        <button id="zoomOut" aria-label="Verkleinern"></button>
        <button id="zoomFit" aria-label="Zentrieren" title="Zentrieren"></button>
      </div>
    </main>
  </div>

  <div id="pauseOv" class="pause-ov hidden" role="dialog" aria-modal="true" aria-label="Pause">
    <div class="pause-card">
      <div class="pause-ico" id="pauseIco"></div>
      <h2>Pause</h2>
      <p>Das Spiel ist angehalten – Bots, Timer und Animationen stehen still.</p>
      <button id="pauseGo" class="btn solid xl pause-go" type="button"></button>
      <button id="pauseMenu" class="btn quiet pause-home" type="button">Zum Hauptmenü</button>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="fx" class="fx" aria-hidden="true"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/MotionPathPlugin.min.js"></script>
  <script src="vendor/confetti.browser.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
