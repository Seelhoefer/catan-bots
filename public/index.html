<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Catan gegen Bots</title>
  <meta name="description" content="Siedler von Catan im Browser – gegen Bots, mit Nebel-Variante, Weltenwandel, Anti-Pech-Markern und Missionen.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="menu" class="screen"></div>

  <div id="game" class="screen hidden">
    <header class="topbar">
      <div class="brand">⬢ Catan</div>
      <div id="turnInfo" class="turn-info"></div>
      <div class="top-actions">
        <button id="btnSpeed" class="chip" title="Geschwindigkeit der Bots"></button>
        <button id="btnMissions" class="chip only-mobile" title="Missionen">🎖️</button>
        <button id="btnLog" class="chip only-narrow" title="Spielverlauf">📜</button>
        <button id="btnRules" class="chip" title="Regeln">📖 Regeln</button>
        <button id="btnMenu" class="chip" title="Hauptmenü">☰ Menü</button>
      </div>
    </header>

    <div class="layout">
      <aside class="side left">
        <div id="players" class="players"></div>
        <div id="missions" class="missions"></div>
      </aside>

      <main class="stage">
        <svg id="board" viewBox="-10 -10 20 20" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="hint" class="hint"></div>
        <div id="diceBox" class="dicebox"></div>
        <div class="zoom">
          <button id="zoomIn" aria-label="Vergrößern">＋</button>
          <button id="zoomOut" aria-label="Verkleinern">－</button>
          <button id="zoomFit" aria-label="Zentrieren" title="Zentrieren">⌖</button>
        </div>
      </main>

      <aside class="side right">
        <h3 class="panel-title">📜 Verlauf</h3>
        <div id="log" class="log"></div>
      </aside>
    </div>

    <footer class="dock">
      <div id="hand" class="hand"></div>
      <div id="actions" class="actions"></div>
    </footer>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
